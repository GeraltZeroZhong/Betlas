schema_version: 1
policy:
  stable_python_api: src/betlas only
  pypi_package: false for every entry below
  tracked_role: repository companion workflows and external-method adapters
  execution_context: run from the repository root with PYTHONPATH=.:src for Python scripts
  smoke_contract: each cli or module_cli entry must support --help without creating workflow outputs
  generated_outputs: write generated tables, downloaded tools, caches, and local environments outside tracked source paths
scripts:
  - path: scripts/run_full_pipeline.py
    category: reproducibility_runner
    entry: cli
    inputs: CATH files, mmCIF cache, optional YAML workflow config
    outputs: labels CSV, Betlas feature CSV, benchmark tables, run manifest
    dependencies: betlas, pandas, omegaconf, tqdm
    stable_python_api: false
    pypi_api: false
  - path: scripts/external_baselines/beta_barrel_detection/foldseek/evaluate_dataset.py
    category: external_baseline_adapter
    entry: cli
    inputs: positive and negative structure directories, Foldseek executable
    outputs: per-record predictions, metrics, run manifest
    dependencies: foldseek, pandas
    stable_python_api: false
    pypi_api: false
  - path: scripts/external_baselines/beta_barrel_detection/foldseek/runner.py
    category: external_baseline_helper
    entry: import_helper
    inputs: Foldseek command parameters
    outputs: subprocess results and parsed tabular output
    dependencies: foldseek
    stable_python_api: false
    pypi_api: false
  - path: scripts/external_baselines/beta_barrel_detection/foldseek/structure_search.py
    category: external_baseline_helper
    entry: cli
    inputs: query and target structure paths
    outputs: Foldseek search tables
    dependencies: foldseek, pandas
    stable_python_api: false
    pypi_api: false
  - path: scripts/external_baselines/beta_barrel_detection/foldseek/structures.py
    category: external_baseline_helper
    entry: import_helper
    inputs: structure directories
    outputs: normalized structure records
    dependencies: biopython
    stable_python_api: false
    pypi_api: false
  - path: scripts/external_baselines/beta_barrel_detection/isitabarrel/evaluate_dataset.py
