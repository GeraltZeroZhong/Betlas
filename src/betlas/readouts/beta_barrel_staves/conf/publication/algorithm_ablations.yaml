variants:
  - name: full
    overrides: []
  - name: no_barrel_wall_graph
    overrides:
      - analyzer.rules.barrel_wall_graph.enabled=false
  - name: no_barrel_wall_complete
    overrides:
      - analyzer.rules.barrel_wall_graph.complete_min_layer_q90=999
  - name: no_sparse_membership
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_enabled=false
  - name: no_near_cycle_candidates
    overrides:
      - analyzer.rules.barrel_wall_graph.near_cycle_variant_enabled=false
  - name: no_cycle_rank_energy
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_cycle_rank_weight=0.0
  - name: no_degree2_energy
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_degree2_fraction_weight=0.0
  - name: no_branch_penalty
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_branch_penalty_weight=0.0
  - name: no_topology_energy
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_cycle_rank_weight=0.0
      - analyzer.rules.barrel_wall_graph.sparse_membership_degree2_fraction_weight=0.0
      - analyzer.rules.barrel_wall_graph.sparse_membership_branch_penalty_weight=0.0
  - name: no_layer_sequence_core
    overrides:
      - analyzer.rules.sequence_core.enabled=false
  - name: terminal_only_layer_sequence_core
    overrides:
      - analyzer.rules.sequence_core.exhaustive_search=false
  - name: no_global_sequence_core
    overrides:
      - analyzer.rules.sequence_core.global_enabled=false
  - name: no_run_window_core
    overrides:
      - analyzer.rules.sequence_core.run_window_enabled=false
  - name: no_radial_outlier
    overrides:
      - analyzer.rules.radial_outlier.enabled=false
  - name: no_trajectory_merge
    overrides:
      - analyzer.count.trajectory_merge_enabled=false
  - name: no_extended_trajectory_merge
    overrides:
      - analyzer.count.trajectory_merge_extended_enabled=false
  - name: extended_support_gap_12
    overrides:
      - analyzer.count.trajectory_merge_extended_min_support_gap=12
  - name: extended_support_gap_16
    overrides:
      - analyzer.count.trajectory_merge_extended_min_support_gap=16
  - name: extended_candidate_30
    overrides:
      - analyzer.count.trajectory_merge_extended_min_candidate_strands=30
  - name: extended_angle_8
    overrides:
      - analyzer.count.trajectory_merge_extended_angle_tolerance_deg=8.0
  - name: extended_run_gap_8
    overrides:
      - analyzer.count.trajectory_merge_extended_max_run_id_gap=8
  - name: extended_gap12_angle8
    overrides:
      - analyzer.count.trajectory_merge_extended_min_support_gap=12
      - analyzer.count.trajectory_merge_extended_angle_tolerance_deg=8.0
  - name: sparse_soft_topology
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_branch_penalty_weight=0.95
      - analyzer.rules.barrel_wall_graph.sparse_membership_block_penalty_weight=0.55
      - analyzer.rules.barrel_wall_graph.sparse_membership_degree2_fraction_weight=0.65
      - analyzer.rules.barrel_wall_graph.sparse_membership_same_edge_agreement_weight=1.35
  - name: sparse_strict_topology
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_branch_penalty_weight=1.20
      - analyzer.rules.barrel_wall_graph.sparse_membership_block_penalty_weight=0.80
      - analyzer.rules.barrel_wall_graph.sparse_membership_degree2_fraction_weight=0.80
      - analyzer.rules.barrel_wall_graph.sparse_membership_max_component_avg_degree=3.5
      - analyzer.rules.barrel_wall_graph.sparse_membership_same_edge_max_component_avg_degree=3.5
  - name: sparse_score_gate_ablation
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_min_score=3.5
  - name: sparse_radial_rank
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_radial_rank_weight=0.50
  - name: sparse_soft_topology_radial
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_branch_penalty_weight=0.95
      - analyzer.rules.barrel_wall_graph.sparse_membership_block_penalty_weight=0.55
      - analyzer.rules.barrel_wall_graph.sparse_membership_degree2_fraction_weight=0.65
      - analyzer.rules.barrel_wall_graph.sparse_membership_same_edge_agreement_weight=1.35
      - analyzer.rules.barrel_wall_graph.sparse_membership_radial_rank_weight=0.50
  - name: near_cycle_candidates_no_radial
    overrides:
      - analyzer.rules.barrel_wall_graph.near_cycle_variant_enabled=true
      - analyzer.rules.barrel_wall_graph.sparse_membership_radial_rank_weight=0.0
  - name: global_high_support
    overrides:
      - analyzer.rules.sequence_core.global_min_layer_count_max=21
      - analyzer.rules.sequence_core.global_min_window_q90_floor=14
      - analyzer.rules.sequence_core.global_min_window_layer_max_fraction=0.85
      - analyzer.rules.sequence_core.global_min_window_q90_fraction=0.75
  - name: run_window_strict
    overrides:
      - analyzer.rules.sequence_core.run_window_min_score=1.65
      - analyzer.rules.sequence_core.run_window_min_count_layer_improvement=7
      - analyzer.rules.sequence_core.run_window_min_layer_q90_fraction=0.85
      - analyzer.rules.sequence_core.run_window_score_length_penalty_weight=0.75
  - name: soft_topology_global_high_support
    overrides:
      - analyzer.rules.barrel_wall_graph.sparse_membership_branch_penalty_weight=0.95
      - analyzer.rules.barrel_wall_graph.sparse_membership_block_penalty_weight=0.55
      - analyzer.rules.barrel_wall_graph.sparse_membership_degree2_fraction_weight=0.65
      - analyzer.rules.barrel_wall_graph.sparse_membership_same_edge_agreement_weight=1.35
      - analyzer.rules.sequence_core.global_min_layer_count_max=21
      - analyzer.rules.sequence_core.global_min_window_q90_floor=14
      - analyzer.rules.sequence_core.global_min_window_layer_max_fraction=0.85
      - analyzer.rules.sequence_core.global_min_window_q90_fraction=0.75
  - name: no_candidate_persistent_score_features
    overrides:
      - analyzer.count.score_candidate_weight=0.0
      - analyzer.count.score_persistent_weight=0.0
      - analyzer.count.score_joint_support_candidate_weight=0.0
      - analyzer.count.score_exact_support_candidate_bonus=0.0
      - analyzer.count.score_selected_mean_support_weight=0.0
      - analyzer.count.score_selected_min_support_weight=0.0
  - name: no_axis_search
    overrides:
      - analyzer.axis_search.enabled=false
  - name: no_axis_report_scoring
    overrides:
      - analyzer.axis_search.report_scoring_enabled=false
  - name: axis_report_candidate_limit_2
    overrides:
      - analyzer.axis_search.report_candidate_limit=2
  - name: axis_report_confidence_only
    overrides:
      - analyzer.axis_search.report_decision_weight=0.0
  - name: axis_report_decision_010
    overrides:
      - analyzer.axis_search.report_decision_weight=0.10
  - name: axis_report_decision_050
    overrides:
      - analyzer.axis_search.report_decision_weight=0.50
