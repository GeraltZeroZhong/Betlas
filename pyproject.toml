[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betlas"
version = "1.1.0"
description = "Interpretable beta-structure descriptors and learned structural applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shuyu Zhong" }]
keywords = [
  "bioinformatics",
  "protein-structure",
  "beta-structure",
  "fold-classification",
  "geometry",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "biopython>=1.81",
  "scikit-learn>=1.2",
  "tqdm>=4.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
geometry = [
  "gemmi>=0.7.4",
  "networkx>=3.4",
  "matplotlib>=3.7",
]
ml = [
  "xgboost>=2.0",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.5",
  "build>=1.2",
]

[project.scripts]
betlas = "betlas.cli:main"

[project.urls]
Homepage = "https://github.com/GeraltZeroZhong/Betlas"
Documentation = "https://github.com/GeraltZeroZhong/Betlas/blob/v1.1.0/README.md"
Repository = "https://github.com/GeraltZeroZhong/Betlas"
Issues = "https://github.com/GeraltZeroZhong/Betlas/issues"
Changelog = "https://github.com/GeraltZeroZhong/Betlas/blob/v1.1.0/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["betlas*"]

[tool.setuptools.package-data]
"betlas.example_data" = ["*.cif"]
"betlas.prediction" = ["*.json"]
"betlas.readouts.beta_barrel_detection" = ["conf/**/*.yaml"]
"betlas.readouts.beta_barrel_staves" = ["conf/**/*.yaml"]
"betlas.ml" = ["conf/**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
