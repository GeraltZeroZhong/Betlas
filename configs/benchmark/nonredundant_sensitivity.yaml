schema: betlas.benchmark-config.latest
models:
  include:
    - grammar_rules
    - xgboost_tuned
xgboost:
  enabled: true
  n_estimators: 320
  tree_method: hist
  device: cuda
  n_jobs: 4
  verbosity: 0
  inner_splits: 2
  param_grid:
    - max_depth: 3
      learning_rate: 0.05
      subsample: 0.85
      colsample_bytree: 0.85
      reg_lambda: 1.0
    - max_depth: 4
      learning_rate: 0.05
      subsample: 0.85
      colsample_bytree: 0.80
      reg_lambda: 2.0
    - max_depth: 4
      learning_rate: 0.08
      subsample: 0.90
      colsample_bytree: 0.85
      reg_lambda: 3.0
    - max_depth: 5
      learning_rate: 0.06
      subsample: 0.85
      colsample_bytree: 0.90
      reg_lambda: 5.0
